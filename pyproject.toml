[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-path-opt"
dynamic = ["version"]
description = "드론 SoC 최대화 경로계획 (WE-LT*): 바람·지형·장애물 고려 계획기, 실시간 운용 플랫폼, ArduPilot 미션 내보내기"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "matplotlib>=3.7",
    "shapely>=2.0",                 # 3D 화면의 건물 모양 (없으면 격자 상자로 그림)
]

[project.optional-dependencies]
mavlink = ["pymavlink>=2.4.40"]                       # 기체 연결 (속도 명령 송신, 바람 수신, 미션 올리기)
data = ["requests", "rasterio", "pygrib", "pyarrow", "fsspec", "aiohttp", "shapely", "pandas"]   # 지형·건물·예보 내려받기
report = ["python-pptx", "pillow", "imageio", "lxml"]  # 발표자료·그림 생성 스크립트
dev = ["pytest>=7", "pymavlink>=2.4.40", "build"]

[project.scripts]
dpo-server = "dpo.webapp.server:main"
dpo-plan = "dpo.cli:main"
dpo-fly = "dpo.flight:main"
dpo-calibrate = "dpo.logcal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dpo = ["webapp/static/*", "webapp/static/vendor/*"]

[tool.setuptools.dynamic]
version = { attr = "dpo.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
